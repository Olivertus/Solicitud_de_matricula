<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud de matrícula | Agencia de Conducción</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="matricula" aria-labelledby="titulo-matricula">
      <form class="formulario" action="#" method="post">
        <header class="formulario__encabezado">
          <img class="formulario__icono" src="img/carro.svg" alt="" width="56" height="56">
          <h1 id="titulo-matricula">Solicitud de matrícula</h1>
          <p>Déjanos tus datos y te contactaremos para iniciar tu curso de conducción.</p>
        </header>

        <div class="campo">
          <label for="nombre"><img src="img/persona.svg" alt="" width="18" height="18"> Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" autocomplete="name" required>
        </div>

        <div class="campo">
          <label for="correo"><img src="img/correo.svg" alt="" width="18" height="18"> Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="telefono"><img src="img/telefono.svg" alt="" width="18" height="18"> Número de teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="3001234567"
                 pattern="[0-9]{10}" maxlength="10" inputmode="numeric" autocomplete="tel"
                 title="Ingresa un número de 10 dígitos, sin espacios ni signos" required>
        </div>

        <div class="campo">
          <label for="curso"><img src="img/curso.svg" alt="" width="18" height="18"> Tipo de curso</label>
          <select id="curso" name="curso" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="carro">Carro</option>
            <option value="moto">Moto</option>
            <option value="mixto">Mixto</option>
          </select>
        </div>

        <div class="campo">
          <label for="mensaje"><img src="img/mensaje.svg" alt="" width="18" height="18"> Mensaje o comentario</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntanos tu horario preferido o cualquier duda"></textarea>
        </div>

        <button type="submit" class="boton">Enviar solicitud</button>
      </form>
    </section>
  </main>
</body>
</html>
